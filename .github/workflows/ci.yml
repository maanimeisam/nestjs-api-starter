name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: nestjs
          POSTGRES_PASSWORD: nestjs
          POSTGRES_DB: nestjs_starter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nestjs -d nestjs_starter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nestjs:nestjs@localhost:5432/nestjs_starter_test
      TEST_DATABASE_URL: postgresql://nestjs:nestjs@localhost:5432/nestjs_starter_test
      DATABASE_SSL: 'false'
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run migration:run
      - run: npm run migration:revert
      - run: npm run migration:run
      - run: npm run build
      - run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up --detach --no-build --wait
      - run: curl --fail http://localhost:3000/api/v1/health
      - if: always()
        run: docker compose down --volumes
